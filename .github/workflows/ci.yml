name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec tsc --noEmit

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

  # Database rules (RLS, RPC permissions, state transitions, races) against a
  # throwaway local Postgres with every migration applied from 0001.
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - run: supabase db start

      - run: supabase test db

      - run: bash supabase/tests/concurrency.sh
