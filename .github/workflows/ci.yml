name: CI

# Actions minutes are limited (2,000 a month on the free plan), so:
# docs-only changes skip CI, a newer push cancels the older run, and the
# browser tests run on master and by hand (Actions → CI → Run workflow),
# not on every pull request push.
on:
  push:
    branches: [main, master]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec tsc --noEmit

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

  # Database rules (RLS, RPC permissions, state transitions, races) against a
  # throwaway local Postgres with every migration applied from 0001.
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - run: supabase db start

      - run: supabase test db

      - run: bash supabase/tests/concurrency.sh

  # Browser tests: the app built and served against a local Supabase seeded
  # with the role accounts from scripts/seed-uat.mjs.
  e2e:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - run: pnpm install --frozen-lockfile

      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Write .env.local from the local stack
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } > .env.local

      - run: node scripts/seed-uat.mjs

      - run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm exec playwright test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results
